# Grafana Alloy збирає логи подів застосунку (namespace library-catalog) і шле їх у Loki.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.*           # перевірити: helm search repo grafana/alloy
    helm:
      releaseName: alloy
      valuesObject:
        controller:
          type: deployment        # одна репліка: loki.source.kubernetes читає логи через API, DaemonSet дублював би їх
          replicas: 1
        alloy:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          configMap:
            content: |
              discovery.kubernetes "pods" {
                role = "pod"
                namespaces {
                  names = ["library-catalog"]
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_component"]
                  target_label  = "component"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_rollouts_pod_template_hash"]
                  target_label  = "rollouts_pod_template_hash"
                }
              }

              loki.source.kubernetes "pods" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
