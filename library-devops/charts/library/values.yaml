# Значення за замовчуванням — середовище розробки (dev).
nameOverride: ""
fullnameOverride: ""

# Скільки секунд Kubernetes чекає прогресу розгортання, перш ніж позначити Deployment як збійний
progressDeadlineSeconds: 600

# Helm-хук і тестовий Pod. Під Argo CD pre-upgrade хук виконується і при першому sync, тому там вимкнено
helmHooks:
  enabled: true

image:
  pullPolicy: IfNotPresent

catalog:
  image:
    repository: vasya1221/catalog-api
    tag: ""            # порожньо -> береться appVersion з Chart.yaml
  replicaCount: 1
  # Поступовий реліз через Argo Rollouts. false -> звичайний Deployment (dev), true -> Rollout.
  rollout:
    enabled: false
    revisionHistoryLimit: 3
    # Обрана стратегія: canary. Зі 4 репліками кожен setWeight відповідає цілому числу подів
    # (25% = 1 под нової версії, 50% = 2, 75% = 3).
    canary:
      maxSurge: 1          # додатковий под під час реліза
      maxUnavailable: 0    # доступність не знижується
      steps:
        - setWeight: 25
        - pause: {duration: 30s}   # пауза з таймером: далі продовжується сама
        - setWeight: 50
        - pause: {}                # ручна пауза: чекає kubectl argo rollouts promote
        - setWeight: 75
        - pause: {duration: 30s}
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

reviews:
  image:
    repository: vasya1221/reviews-api
    tag: ""
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

mongo:
  image:
    repository: mongo
    tag: "7"
  service:
    port: 27017
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Несекретні параметри застосунку (потрапляють у ConfigMap)
config:
  dbName: library
  logLevel: info

# Чутливі параметри (потрапляють у Secret). Реальні паролі тут не зберігаються:
# для prod пароль передається через --set secret.mongoRootPassword=...
secret:
  # Якщо задано — чарт не створює Secret, а використовує вже наявний у кластері.
  # Він має містити ключі MONGO_ROOT_USERNAME, MONGO_ROOT_PASSWORD, MONGO_URI.
  existingSecret: ""
  mongoRootUsername: admin
  mongoRootPassword: dev-demo-password

ingress:
  enabled: false
  className: nginx
  host: library.local
