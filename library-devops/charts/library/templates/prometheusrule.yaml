{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "library.fullname" . }}-alerts
  labels:
    {{- include "library.labels" . | nindent 4 }}
spec:
  groups:
    - name: library.rules
      rules:
        - alert: LibraryHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}",status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[1m]))
            > {{ .Values.alerts.errorRateThreshold }}
          for: {{ .Values.alerts.forDuration }}
          labels:
            severity: warning
          annotations:
            summary: Висока частка помилок 5xx у застосунку library
            description: "Частка відповідей 5xx становить {{ "{{ $value | humanizePercentage }}" }} (поріг {{ .Values.alerts.errorRateThreshold }})."
{{- end }}
