apiVersion: v1
kind: Service
metadata:
  name: {{ include "library.fullname" . }}-mongo
  labels:
    {{- include "library.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  selector:
    {{- include "library.selectorLabels" (dict "root" . "component" "mongo") | nindent 4 }}
  ports:
    - port: {{ .Values.mongo.service.port }}
      targetPort: 27017
