# Значення для кластера minikube під керуванням Argo CD.
# Паролів тут немає: Secret library-secret створюється в кластері вручну (див. docs/lab5-gitops.md).
catalog:
  image:
    repository: vasya1221/catalog-api
    tag: "1.4.0"          # 1.4.0 = перша версія з /metrics, JSON-логами та FAIL_RATE (ЛР7)
  replicaCount: 4        # не менше 4 реплік: видно співвідношення версій під час canary
  failRate: "0.5"          # "0" = версія здорова; "0.5" = 50% запитів отримують 500 (поганий реліз)
  rollout:
    enabled: true        # Deployment каталогу замінено на Rollout (стратегія canary описана у values.yaml)

reviews:
  image:
    repository: vasya1221/reviews-api
    tag: "1.4.0"
  replicaCount: 2

secret:
  existingSecret: library-secret

helmHooks:
  enabled: false

progressDeadlineSeconds: 60

ingress:
  enabled: false

# --- ЛР7 ---
metrics:
  serviceMonitor:
    enabled: true

# Спочатку false: перший реліз 1.2.0 -> 1.4.0 іде без навантаження, а аналіз без трафіку
# закінчується помилкою. Після запуску навантаження змініть на true (docs/lab7-observability.md, крок 7).
analysis:
  enabled: true

alerts:
  enabled: true

dashboards:
  enabled: true
