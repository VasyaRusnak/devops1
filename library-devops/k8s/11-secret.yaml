# Увага: значення нижче — навчальні/демонстраційні, не реальні паролі робочих систем.
# У реальному проєкті цей файл не комітять у Git відкритим текстом (sealed-secrets,
# SOPS, зовнішній secret-manager тощо) — тут лишено у відкритому вигляді навмисно,
# щоб показати механіку Secret у межах лабораторної роботи.
apiVersion: v1
kind: Secret
metadata:
  name: mongo-secret
  namespace: library-catalog
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: "admin"
  MONGO_ROOT_PASSWORD: "lab-demo-pass-2026"
  MONGO_URI: "mongodb://admin:lab-demo-pass-2026@mongo:27017/library?authSource=admin"
