apiVersion: v1
kind: Secret
metadata:
  name: {{ include "library.fullname" . }}-secret
  labels:
    {{- include "library.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: {{ .Values.secret.mongoRootUsername | quote }}
  MONGO_ROOT_PASSWORD: {{ required "secret.mongoRootPassword must be set (use --set secret.mongoRootPassword=...)" .Values.secret.mongoRootPassword | quote }}
  MONGO_URI: {{ printf "mongodb://%s:%s@%s-mongo:%v/%s?authSource=admin" (.Values.secret.mongoRootUsername | urlquery) (.Values.secret.mongoRootPassword | urlquery) (include "library.fullname" .) .Values.mongo.service.port .Values.config.dbName | quote }}
