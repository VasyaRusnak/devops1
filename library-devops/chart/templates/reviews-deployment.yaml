apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "library.fullname" . }}-reviews
  labels:
    {{- include "library.labels" . | nindent 4 }}
    app.kubernetes.io/component: reviews
spec:
  replicas: {{ .Values.reviews.replicaCount }}
  selector:
    matchLabels:
      {{- include "library.selectorLabels" (dict "root" . "component" "reviews") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "library.selectorLabels" (dict "root" . "component" "reviews") | nindent 8 }}
    spec:
      containers:
        - name: reviews-api
          image: "{{ .Values.reviews.image.repository }}:{{ .Values.reviews.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "library.fullname" . }}-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "library.fullname" . }}-secret
                  key: MONGO_URI
          resources:
            {{- toYaml .Values.reviews.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
