# ЗАМІНІТЬ ghcr.io/OWNER/REPO на свій реальний шлях з GHCR (у нижньому регістрі),
# опублікований у ЛР№2, напр.: ghcr.io/ivanenko/library-devops/catalog-api:1.0.0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: library-catalog
  labels:
    app: catalog-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: vasya1221/catalog-api:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
