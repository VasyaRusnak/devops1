name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------
  # Job 1: lint + build (sanity import) + test — per service, in parallel.
  # Independent matrix entries: one service failing does not cancel the other.
  # ---------------------------------------------------------------------
  test:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, reviews-api]
    defaults:
      run:
        working-directory: library-devops/${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: library-devops/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff) — blocking
        run: ruff check app tests

      - name: Build (sanity import check)
        run: python -c "import app.main; print('app.main imported OK')"

      - name: Test (pytest)
        run: pytest -v

  # ---------------------------------------------------------------------
  # Job 2: build container images (needs successful test job for all services).
  # Built locally on the runner only, not published here.
  # ---------------------------------------------------------------------
  build-image:
    name: build-image (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, reviews-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ./library-devops/${{ matrix.service }}
          push: false
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Save image as artifact
        run: docker save ${{ matrix.service }}:${{ github.sha }} -o ${{ matrix.service }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar
          retention-days: 1

  # ---------------------------------------------------------------------
  # Job 3: vulnerability scan of the built image — blocking gate before publish.
  # ---------------------------------------------------------------------
  scan-image:
    name: scan (${{ matrix.service }})
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, reviews-api]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}

      - name: Load image
        run: docker load -i ${{ matrix.service }}.tar

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------
  # Job 4: publish to GitHub Container Registry.
  # Runs only for push events (never for pull_request). Tags: <sha> always,
  # <latest> only for the main branch.
  # ---------------------------------------------------------------------
  publish:
    name: publish (${{ matrix.service }})
    needs: scan-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, reviews-api]
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}

      - name: Load image
        run: docker load -i ${{ matrix.service }}.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Tag and push (commit SHA)
        run: |
          docker tag ${{ matrix.service }}:${{ github.sha }} ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

      - name: Tag and push (latest — main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ matrix.service }}:${{ github.sha }} ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:latest